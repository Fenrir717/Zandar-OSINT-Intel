name: zandar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zandar
      POSTGRES_PASSWORD: zandar
      POSTGRES_DB: zandar
    ports:
      - "5433:5432"   # host 5433 → hindari bentrok Postgres WSL (pentest) di 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zandar -d zandar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # host 6380 → isolasi dari stack WSL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/zandarneo4j
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7475:7474"   # browser
      - "7688:7687"   # bolt
    volumes:
      - neo4j_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zandar
      MINIO_ROOT_PASSWORD: zandarminio
    ports:
      - "9002:9000"   # S3 API
      - "9003:9001"   # console
    volumes:
      - minio_data:/data

  # --- Observability (opsional): docker compose --profile observability up -d ---
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["observability"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["observability"]
    depends_on:
      - langfuse-db
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ganti-secret-langfuse
      SALT: ganti-salt-langfuse
    ports:
      - "3001:3000"

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  langfuse_pg_data:
